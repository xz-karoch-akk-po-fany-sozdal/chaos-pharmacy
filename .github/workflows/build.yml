
name: Build Chaos Pharmacy

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Find project and build
        run: |
          PROJECT_DIR="$(dirname "$(find . -name settings.gradle -not -path '*/.gradle/*' -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          gradle -p "$PROJECT_DIR" build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: chaos-pharmacy-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
